url: https://themis.tidymodels.org

template:
  package: tidytemplate
  bootstrap: 5
  bslib:
    primary: "#CA225E"
  includes:
    in_header: |
      <script src="https://cdn.jsdelivr.net/gh/posit-dev/supported-by-posit/js/badge.min.js" data-max-height="43" data-light-bg="#666f76" data-light-fg="#f9f9f9"></script>
      <!-- Privacy-friendly analytics by Plausible -->
      <script async src="https://plausible.io/js/pa-iRPZwdy8p-n7xYPq_6hNJ.js"></script>
      <script>
        window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
        plausible.init()
      </script>
development:
  mode: auto

articles:
- title: Getting started
  navbar: ~
  contents:
  - articles/ratio
  - articles/methods-overview
  - articles/common-pitfalls

reference:
- title: Over-sampling
  desc: >
    **Over-sampling** is the act of synthetically generating observations for
    the minority classes, either by random replication or by more advanced
    methods that synthesize new observations.
- subtitle: Random replication
  contents:
  - step_upsample
- subtitle: SMOTE family
  contents:
  - step_smote
  - step_bsmote
  - step_svmsmote
  - step_smotenc
  - step_smoten
- subtitle: Adaptive
  contents:
  - step_adasyn
- subtitle: Smoothed bootstrap
  contents:
  - step_rose
- title: Under-sampling
  desc: >
    **Under-sampling** is the act of removing observations from the majority
    classes. Every under-sampler here uses *prototype selection*, keeping a
    subset of the real rows, rather than *prototype generation*, which would
    create new representative rows.
- subtitle: Random
  contents:
  - step_downsample
- subtitle: Distance / near-boundary
  contents:
  - step_nearmiss
  - step_tomek
  - step_cnn
  - step_oss
- subtitle: Neighborhood cleaning
  contents:
  - step_enn
  - step_ncl
- subtitle: Hardness
  contents:
  - step_instance_hardness
- title: Regression
  desc: >
    Resampling an imbalanced numeric outcome rather than a class.
  contents:
  - step_smogn
- title: Methods
  desc: >
    Some of the methods implemented in this package as steps are also
    available as their own functions.
  contents:
  - smote
  - smogn
  - smotenc
  - smoten
  - bsmote
  - svmsmote
  - adasyn
  - rose
  - cnn
  - enn
  - instance_hardness
  - ncl
  - nearmiss
  - oss
  - tomek
- title: Datasets
  contents:
  - circle_example
- title: Developer tools
  contents:
  - required_pkgs.step_adasyn
